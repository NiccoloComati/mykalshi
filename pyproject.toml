[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mykalshi"
version = "0.2.0"
description = "Research, data collection, and trading utilities for the Kalshi API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=44.0.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
]

[project.optional-dependencies]
analysis = [
  "ipykernel>=6.29.0",
  "ipython>=8.0.0",
  "ipywidgets>=8.1.0",
  "matplotlib>=3.8.0",
  "mplfinance>=0.12.10b0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "seaborn>=0.13.0",
]
storage = [
  "boto3>=1.34.0",
  "pyarrow>=18.0.0",
]
websocket = [
  "websockets>=14.1",
]

[project.scripts]
mykalshi = "mykalshi.cli:main"

[tool.setuptools.packages.find]
include = ["mykalshi*"]
